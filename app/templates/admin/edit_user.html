{% extends 'base.html' %} 

{% block content %}
<h1>Benutzer {{ user['username'] }} bearbeiten</h1>
<form action="{{url_for('admin.post_edit_user', user_id=user['user_id'])}}" method="post">
    {% if user.user_id == current_user['user_id'] %}
    <label for="current_password">Aktuelles Passwort</label>
    <input type="password" name="current_password" id="current_password" required>
    <label for="new_password">Neues Passwort</label>
    <input type="password" name="new_password" id="new_password" required>
    <label for="new_password_repeat">Neues Passwort wiederholen</label>
    <input type="password" name="new_password_repeat" id="new_password_repeat" required>
    {% elif current_user['role'] == "admin" %}
    <label for="roles">Benutzerrechte</label>
    <select name="roles" id="roles" required>
        {% for role in roles %}
        <option value="{{ role['role_id'] }}" {% if user['role_id']==role['role_id'] %}selected{% endif %}>{{ role['role'] }}</option>
        {% endfor %}
    </select>
    {% endif %}
    <input class="button-form" type="submit" value="Speichern">
</form>
{% endblock %}
