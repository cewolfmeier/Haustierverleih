{% extends 'base.html' %} 

{% block content %}
{% if user != None %}
<h1>Benutzer {{ user['username'] }} bearbeiten</h1>
<form action="{{url_for('admin.edit_user', user_id=user['user_id'])}}" method="post">
    <label for="roles">Benutzerrechte</label>
    <select name="roles" id="roles" required>
        {% for role in roles %}
        <option value="{{ role['role_id'] }}" {% if user['role_id']==role['role_id'] %}selected{% endif %}>{{ role['role'] }}</option>
        {% endfor %}
    </select>
    <input class="button-form" type="submit" value="Speichern">
</form>
{% endif %}
{% endblock %}
