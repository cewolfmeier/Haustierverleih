<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> 
        <title>Haustierverleih</title> 
    </head> 
    <body>
        <nav>
            <a href="{{ url_for('index')}}">
                <img src="{{ url_for('static', filename='pictures/logo.png')}}" alt="Das Logo des Haustierverleihs">
            </a>
            <ul class="navigation">
                {% if current_user != None %}
                <li>Moin {{current_user["username"]}}!</li>
                <li><a href="{{ url_for('logout') }}" class="button">Ausloggen</a></li>
                {% else %}
                <li><a href="{{ url_for('register') }}" class="button">Registrieren</a></li>
                <li><a href="{{ url_for('login') }}" class="button">Einloggen</a></li>
                {% endif %}
            </ul> 
        </nav>
        {% block content %}{% endblock %}
        <footer>
            Haustierverleih 2025
        </footer>
    </body> 
</html>
