<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> 
        <title>Haustierverleih</title> 
    </head> 
    <body>
        <nav>
            <ul>
                {% if current_user != None %}
                <li>Moin {{current_user["username"]}}!</li>
                <li><a href="{{ url_for('logout') }}">Ausloggen</a></li>
                {% else %}
                <li><a href="{{ url_for('register') }}">Registrieren</a></li>
                <li><a href="{{ url_for('login') }}">Einloggen</a></li>
                {% endif %}
            </ul>
            <img src="{{ url_for('static', filename='pictures/logo.png')}}" alt="Das logo des Haustierverleihs">
        </nav>
        {% block content %}{% endblock %}
    </body> 
</html>
