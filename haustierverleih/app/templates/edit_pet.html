{% extends 'base.html' %} 

{% block content %}
<h1>Haustier {{ pet['name'] }} editieren</h1>
<div>
    <form action="{{url_for('pet', pet_id=pet['pet_id'])}}">
        <label for="pet_name">Name</label>
        <input type="text" name="Name" id="pet_name" value="{{ pet['name']}}">
        <label for="pet_description">Beschreibung</label>
        <input type="text" name="Beschreibung" id="pet_description" value="{{ pet['description']}}">
        <label for="animal_type">Tierart</label>
        <select name="Tierart" id="animal_type">
            <option value="dog">Hund</option>
            <option value="cat" {% if pet["animal_type"]=='cat' %}selected{% endif %}>Katze</option>
        </select>
        <input type="submit" value="Speichern">
    </form>
</div>
{% endblock %}
