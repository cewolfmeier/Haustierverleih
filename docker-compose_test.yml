services:
  mariadb:
    container_name: mariadb
    image: mariadb:latest
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: <DATABASE>
      MARIADB_USER: <USER>
      MARIADB_PASSWORD: <PASSWORD>
    networks:
      - haustierverleih-network
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
  haustierverleih:
    container_name: haustierverleih
    hostname: haustierverleih
    build:
      context: ./
    depends_on:
      mariadb:
        condition: service_started
    ports:
      - "5000"
    environment:
      SECRET_KEY: <SECRET_KEY>
      DATABASE_URL: mariadb+mariadbconnector://<USER>:<PASSWORD>@mariadb/<DATABASE>
    networks:
      - haustierverleih-network
    restart: unless-stopped
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - haustierverleih-network

networks:
  haustierverleih-network:
    driver: bridge

volumes:
  mariadb_data:
